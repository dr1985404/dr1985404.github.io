<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Free MCCQE1 exam prep - Q-Bank with 2357 questions and High-Yield notes for Canadian medical licensing">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6061088335639984" crossorigin="anonymous"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-37QQETTBR9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-37QQETTBR9');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediVault Pro | MCCQE1 Elite Edition</title>
  
  <style>
    :root{
      --navy:#0b1730; --navy2:#132347; --gold:#c8a45c; --bg:#f4f7fb;
      --card:#ffffff; --text:#1f2a37; --muted:#6b7280; --line:#e5e7eb;
      --green:#22c55e; --red:#ef4444; --blue:#2563eb;
      --shadow:0 10px 25px rgba(15,23,42,.08); --radius:16px;
    }
    *{ box-sizing:border-box; -webkit-user-select:none; user-select:none; }
    body{ margin:0; font-family:Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:120px; }
    header{ position:sticky; top:0; z-index:1000; background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; border-bottom:3px solid var(--gold); }
    .topbar{ max-width:1100px; margin:0 auto; padding:16px; display:flex; align-items:center; justify-content:space-between; }
    .brand{ font-size:1.4rem; font-weight:900; }
    .social-btns{ display:flex; gap:8px; }
    .social-link{ color:#fff; text-decoration:none; background:rgba(255,255,255,0.15); padding:8px 12px; border-radius:999px; font-size:0.8rem; font-weight:800; border:1px solid rgba(255,255,255,0.2); transition: 0.2s; }
    .vault-stats{ background:#fff; padding:12px; border-bottom:1px solid var(--line); display:flex; justify-content:center; gap:20px; font-size:0.85rem; font-weight:800; }
    .stat-val{ color:var(--blue); font-size:1rem; }
    .main-tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:67px; z-index:999; }
    .tab{ flex:1; text-align:center; padding:14px; cursor:pointer; font-weight:800; color:#64748b; }
    .tab.active{ color:var(--blue); border-bottom:4px solid var(--blue); background:#f8fbff; }
    .container{ max-width:1100px; margin:20px auto; padding:0 14px; }
    .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .dashboard{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; padding:16px; }
    .sub-card{ background:#fff; border-radius:18px; padding:20px; text-align:center; cursor:pointer; border:1px solid var(--line); transition:.2s; }
    .sub-card:hover{ transform:translateY(-4px); border-color:var(--gold); }
    .sub-card i{ display:block; font-size:2.2rem; margin-bottom:10px; }
    .card{ background:#fff; border-radius:18px; border:1px solid var(--line); margin-bottom:16px; overflow:hidden; }
    .card-header{ padding:12px 18px; color:#fff; font-weight:800; display:flex; justify-content:space-between; background:var(--navy); }
    .card-body{ padding:25px; line-height:1.7; font-size:1.05rem; }
    .option{ padding:14px; border:1px solid #dbe2ea; border-radius:12px; margin-bottom:10px; cursor:pointer; background:#fff; }
    .option.correct{ background:#e9f9ef!important; border-color:#22c55e!important; color:#166534!important; font-weight:800; }
    .option.wrong{ background:#fef0f0!important; border-color:#ef4444!important; color:#991b1b!important; font-weight:800; }
    .rationale{ display:none; margin-top:15px; padding:15px; border-top:1px solid var(--line); background:#f9fafb; border-radius:8px; }
    .btn{ border:none; border-radius:12px; padding:14px; font-weight:800; cursor:pointer; flex:1; }
    .btn-gold{ background:var(--gold); color:#fff; }
    .btn-light{ background:#f3f4f6; color:var(--text); }
    body.dark{ --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --line:#334155; }
    body.dark .vault-stats, body.dark .main-tabs, body.dark .panel, body.dark .sub-card, body.dark .card, body.dark .option{ background:var(--card); border-color:var(--line); color: var(--text); }
    #sub-dashboard,#view-area,#main-dashboard{ display:none; }
    
    /* ضمان ظهور الودجت فوق كل شيء */
    #bmc-w2 { z-index: 9999999 !important; }
  </style>
</head>
<body>

  <header>
    <div class="topbar">
      <div class="brand">MEDIVAULT PRO</div>
      <div class="social-btns">
        <button class="social-link" style="background:none; border:none; cursor:pointer;" onclick="toggleDark()">🌙</button>
        <a class="social-link" href="https://www.youtube.com/@Drab123-v7l" target="_blank">📺 YT</a>
        <a class="social-link" href="https://www.facebook.com/share/1B5BwQUhim/" target="_blank">📘 FB</a>
      </div>
    </div>
  </header>

  <div class="vault-stats">
    <div>📋 Questions: <span id="total-q" class="stat-val">0</span></div>
    <div>✅ Solved: <span id="total-solved" class="stat-val">0</span></div>
  </div>

  <div class="main-tabs">
    <div class="tab active" id="tab-questions" onclick="switchMainTab('questions')">Q-BANK</div>
    <div class="tab" id="tab-notes" onclick="switchMainTab('notes')">NOTES</div>
    <div class="tab" id="tab-bookmarks" onclick="switchMainTab('bookmarks')">🔖 SAVED</div>
  </div>

  <div class="container">
    <div class="panel">
      <div id="main-dashboard" class="dashboard"></div>
      <div id="sub-dashboard" class="dashboard"></div>
      <div id="view-area" style="padding:16px;">
        <div id="progress-text" style="font-weight:800; color:var(--muted); margin-bottom:12px;"></div>
        <div id="content-container"></div>
        <div id="nav-btns" style="display:flex; gap:10px; margin-top:15px;"></div>
        <button class="btn btn-light" style="width:100%; margin-top:10px;" onclick="goBack()">← Back</button>
      </div>
    </div>
  </div>

  <script>
    let bank=[],notes=[],filteredQuestions=[],currentIdx=0;
    let activeMainTab="questions",currentCategory="";
    let answered=JSON.parse(localStorage.getItem('answered_questions')||'[]');
    let bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]');

    const qFiles=["questions.json","extra_questions.json","extra_questions_2.json","ethics_questions.json","neuro.json"];
    const nFiles=["notes.json","clinical_cards.json","extra1.json"];

    function toggleDark(){ document.body.classList.toggle('dark'); localStorage.setItem('dark', document.body.classList.contains('dark')?'1':'0'); }
    if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');

    async function init(){
      let rawB=[];
      for(let f of qFiles){const r=await fetch(`./${f}?v=${Date.now()}`); if(r.ok){const d=await r.json(); rawB=rawB.concat(d);}}
      bank=rawB;
      for(let f of nFiles){const r=await fetch(`./${f}?v=${Date.now()}`); if(r.ok){const d=await r.json(); notes=notes.concat(d);}}
      document.getElementById('total-q').innerText=bank.length;
      document.getElementById('total-solved').innerText=answered.length;
      renderMain();
    }

    function renderMain(){
      hideAll();
      const data=(activeMainTab==="questions"?bank:notes);
      if(activeMainTab==="bookmarks") { showBookmarks(); return; }
      const cats=[...new Set(data.map(x=>x.cat))].sort();
      const db=document.getElementById("main-dashboard"); db.style.display="grid";
      db.innerHTML=cats.map(c=>`<div class="sub-card" onclick="openCat('${c}')"><i>${getIcon(c)}</i><h3>${c}</h3><p>${data.filter(x=>x.cat===c).length} items</p></div>`).join("");
    }

    function hideAll(){
      document.getElementById("main-dashboard").style.display="none";
      document.getElementById("sub-dashboard").style.display="none";
      document.getElementById("view-area").style.display="none";
    }

    function openCat(c){
      hideAll(); currentCategory=c; currentIdx=0;
      document.getElementById("view-area").style.display="block";
      filteredQuestions=bank.filter(q=>q.cat===currentCategory);
      showQ();
    }

    function showQ(){
      const q=filteredQuestions[currentIdx];
      const isBm=bookmarks.includes(q.id);
      document.getElementById("content-container").innerHTML=`
        <div class="card">
          <div class="card-header"><span>ID: ${q.id}</span><button onclick="toggleBookmark('${q.id}')" style="background:none;border:none;color:white;font-size:1.2rem;cursor:pointer;">${isBm?'⭐':'☆'}</button></div>
          <div class="card-body">
            <p><strong>${q.text}</strong></p>
            ${q.options.map((o,i)=>`<div class="option" onclick="handleAns(${i},${q.correct},'${q.id}')">${o}</div>`).join("")}
            <div id="rat" class="rationale"><strong>Rationale:</strong><br>${q.rationale}</div>
          </div>
        </div>`;
      renderNav();
    }

    function handleAns(idx,cor,qId){
      const ops=document.querySelectorAll(".option");
      ops.forEach((op,i)=>op.className="option "+(i===cor?"correct":(i===idx?"wrong":"")));
      document.getElementById("rat").style.display="block";
      if(!answered.includes(qId)){ answered.push(qId); localStorage.setItem('answered_questions',JSON.stringify(answered)); }
    }

    function renderNav(){
      document.getElementById("nav-btns").innerHTML=`<button class="btn btn-light" onclick="prev()">Prev</button><button class="btn btn-gold" onclick="next()">Next</button>`;
    }

    function next(){ if(currentIdx<filteredQuestions.length-1){currentIdx++; showQ();} }
    function prev(){ if(currentIdx>0){currentIdx--; showQ();} }
    function goBack(){ renderMain(); }
    function switchMainTab(t){ activeMainTab=t; renderMain(); }
    function getIcon(c){ const icons={Medicine:"🩺",Surgery:"🔪",Pediatrics:"👶",Ethics:"⚖️",Neurology:"🧠"}; return icons[c]||"📚"; }
    function toggleBookmark(id){ if(bookmarks.includes(id)) bookmarks=bookmarks.filter(b=>b!==id); else bookmarks.push(id); localStorage.setItem('bookmarks',JSON.stringify(bookmarks)); showQ(); }

    init();
  </script>

  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="MediVaultPro" data-description="Support me on Buy me a coffee!" data-message="" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>

</body>
</html>
