  <script>
    let bank=[],notes=[],cdm=[],tricks=[],filteredQuestions=[],filteredNotes=[],currentIdx=0;
    let activeMainTab="questions",currentCategory="",currentSubcategory="",examMode=false,examSec=0,timerInt,userSels={};
    let answered=JSON.parse(localStorage.getItem('answered_questions')||'[]');
    let bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]');

    const qFiles=["questions.json","extra_questions.json","extra_questions_2.json","extra_questions_3.json","ethics_questions.json","eq2_part1.json","eq2_part2.json","eq2_part3.json","eq2_part4.json","eq2_part5.json","eq2_part6.json"];
    const nFiles=["notes.json","clinical_cards.json","extra1.json"];
    const cdmFiles=["cdm_cases.json"];
    const tFiles=["mnemonics.json"];

    async function fetchJson(f){
      try{
        const r=await fetch(`./${f}?v=${Date.now()}`);
        if(!r.ok) return [];
        const data = await r.json();
        return Array.isArray(data) ? data : [];
      }catch(e){ return[]; }
    }

    async function init(){
      for(const f of qFiles) { const d = await fetchJson(f); bank = bank.concat(d); }
      for(const f of nFiles) { const d = await fetchJson(f); notes = notes.concat(d); }
      for(const f of cdmFiles) { const d = await fetchJson(f); cdm = cdm.concat(d); }
      for(const f of tFiles) { const d = await fetchJson(f); tricks = tricks.concat(d); }
      
      bank = bank.filter(q => q && q.text && q.id);
      document.getElementById('loading-area').style.display="none";
      document.getElementById('total-q').innerText = bank.length;
      document.getElementById('total-n').innerText = notes.length + cdm.length;
      document.getElementById('total-solved').innerText = answered.length;
      updateDashboard();
      renderMain();
    }

    function toggleDark(){ document.body.classList.toggle('dark'); localStorage.setItem('dark', document.body.classList.contains('dark')?'1':'0'); }
    if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');

    function updateDashboard(){
      const diff = new Date('2026-10-21') - new Date();
      document.getElementById('exam-timer').innerText = diff > 0 ? Math.floor(diff/(1000*60*60*24)) + " Days" : "Exam";
      document.getElementById('study-streak').innerText = (localStorage.getItem('study_streak') || '0') + " Days";
    }

    function trackActivity(){
      const today = new Date().toDateString();
      let dailyData = JSON.parse(localStorage.getItem('daily_stats') || '{}');
      if(dailyData.date === today) dailyData.count++; else dailyData = { date: today, count: 1 };
      localStorage.setItem('daily_stats', JSON.stringify(dailyData));
      let lastDate = localStorage.getItem('last_study_date');
      let streak = parseInt(localStorage.getItem('study_streak') || '0');
      if(lastDate !== today){
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
        streak = (lastDate === yesterday.toDateString()) ? streak + 1 : 1;
        localStorage.setItem('study_streak', streak);
        localStorage.setItem('last_study_date', today);
      }
      updateDashboard();
    }

    function hideAll(){
      document.getElementById("content-container").innerHTML="";
      ["main-dashboard","sub-dashboard","view-area","mode-panel","progress-section"].forEach(id=>document.getElementById(id).style.display="none");
      if(!examMode) clearInterval(timerInt);
    }

    function switchMainTab(t){
      activeMainTab=t;
      ["tab-questions","tab-notes","tab-cdm","tab-tricks","tab-bookmarks"].forEach(id=>document.getElementById(id).className="tab"+(id==="tab-"+t?" active":""));
      renderMain();
    }

    function renderMain(){
      hideAll();
      if(activeMainTab==="bookmarks"){ showBookmarks(); return; }
      if(activeMainTab==="tricks"){ renderTricks(); return; }
      const data=(activeMainTab==="questions"?bank:(activeMainTab==="cdm"?cdm:notes));
      const cats=[...new Set(data.map(x=>x.cat))].sort();
      const db=document.getElementById("main-dashboard"); db.style.display="grid";
      db.innerHTML=cats.map(c=>{
        const count=data.filter(x=>x.cat===c).length;
        const solved=activeMainTab==="questions"?data.filter(x=>x.cat===c&&answered.includes(x.id)).length:0;
        const pct=count?Math.round(solved/count*100):0;
        return `<div class="sub-card" onclick="openCat('${c}')"><i>${getIcon(c)}</i><h3>${c}</h3><p>${count} items</p>${activeMainTab==="questions"?`<div style="width:100%; background:#e2e8f0; border-radius:999px; height:4px; margin-top:6px;"><div style="height:4px; border-radius:999px; background:var(--blue); width:${pct}%"></div></div>`:''}</div>`;
      }).join("");
    }

    function renderTricks(){
      hideAll(); const db=document.getElementById("main-dashboard"); db.style.display="grid";
      db.innerHTML=tricks.map(t=>`<div class="mnemonic-card" style="border-left-color:${t.color}"><div class="mnemonic-header" style="background:${t.color}"><span>${t.icon} ${t.title}</span><span style="font-size:0.7rem;opacity:0.8;">${t.cat}</span></div><div class="mnemonic-body"><div class="mnemonic-code">${t.mnemonic}</div><div>${t.content}</div></div></div>`).join("");
    }

    function showBookmarks(){
      hideAll(); const bqs=bank.filter(q=>bookmarks.includes(q.id));
      if(bqs.length===0){ document.getElementById("main-dashboard").style.display="grid"; document.getElementById("main-dashboard").innerHTML=`<div style="padding:30px;text-align:center;grid-column:1/-1;">🔖 No saved questions.</div>`; return; }
      filteredQuestions=bqs; currentIdx=0; currentSubcategory="bookmarks"; currentCategory="Bookmarks";
      document.getElementById("view-area").style.display="block"; showQ();
    }

    function openCat(c){
      hideAll(); currentCategory=c; const data=(activeMainTab==="questions"?bank:(activeMainTab==="cdm"?cdm:notes));
      const subs=[...new Set(data.filter(x=>x.cat===c).map(x=>x.sub||"General"))].sort();
      const sdb=document.getElementById("sub-dashboard"); sdb.style.display="grid";
      sdb.innerHTML=`<div class="sub-card" onclick="start('All')"><i>📂</i><h3>All</h3></div>` + subs.map(s=>`<div class="sub-card" onclick="start('${s}')"><i>🧩</i><h3>${s}</h3></div>`).join("") + `<div class="sub-card" onclick="renderMain()" style="background:#fef2f2;"><i>↩️</i><h3>Back</h3></div>`;
    }

    function start(s){
      hideAll(); currentSubcategory=s; currentIdx=0; userSels={};
      document.getElementById("view-area").style.display="block";
      if(activeMainTab==="questions"){
        document.getElementById("mode-panel").style.display="flex"; document.getElementById("progress-section").style.display="block";
        filteredQuestions=bank.filter(q=>q.cat===currentCategory&&(s==="All"||q.sub===s)); showQ();
      } else {
        filteredNotes=(activeMainTab==="cdm"?cdm:notes).filter(n=>n.cat===currentCategory&&(s==="All"||n.sub===s)); showNote();
      }
    }

    function showNote(){
      const n=filteredNotes[currentIdx]; if(!n) return;
      document.getElementById("content-container").innerHTML=`<div class="card" style="border-top:6px solid ${activeMainTab==="cdm"?'var(--green)':'var(--blue)'}"><div class="card-header" style="background:${activeMainTab==="cdm"?'var(--green)':'var(--blue)'}">${n.title}</div><div class="card-body">${getSafeImg(n.img)}<div>${n.content}</div>${n.quiz?`<div style="margin-top:15px;padding:12px;background:#f0f9ff;border-radius:10px;border:1px dashed var(--blue);"><div style="font-weight:800;color:var(--blue);">🎯 Decision:</div><div>${n.quiz.q}</div><button class="btn btn-gold" style="margin-top:8px;padding:6px;" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">Show Answer</button><div style="display:none;margin-top:8px;color:var(--green);font-weight:800;">${n.quiz.a}</div></div>`:''}</div></div>`;
      renderNav();
    }

    function showQ(){
      const q=filteredQuestions[currentIdx]; if(!q) return;
      let opsHtml=q.options.map((o,i)=>`<div class="option ${!examMode&&answered.includes(q.id+i)?(i===q.correct?'correct':'wrong'):(examMode&&userSels[currentIdx]===i?'selected':'')}" onclick="handleAns(${i},${q.correct},'${q.id}')">${o}</div>`).join("");
      document.getElementById("content-container").innerHTML=`<div class="card" style="border-top:5px solid var(--navy)"><div class="card-header" style="background:var(--navy)"><span>ID: ${q.id}</span><button onclick="toggleBookmark('${q.id}')" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">${bookmarks.includes(q.id)?'⭐':'☆'}</button></div><div class="card-body"><div style="font-weight:800;margin-bottom:12px;">${q.text}</div>${getSafeImg(q.img)}${opsHtml}<div class="rationale" id="rat" style="${!examMode&&answered.includes(q.id)?'display:block':''}"><strong>Explanation:</strong><br>${q.rationale}</div></div></div>`;
      renderNav(); updateProgress();
    }

    function handleAns(idx,cor,qId){
      if(examMode){ userSels[currentIdx]=idx; showQ(); }
      else {
        const ops=document.querySelectorAll(".option"); ops.forEach((op,i)=>op.className="option "+(i===cor?"correct":(i===idx?"wrong":"")));
        document.getElementById("rat").style.display="block";
        if(!answered.includes(qId)){ answered.push(qId); localStorage.setItem('answered_questions',JSON.stringify(answered)); document.getElementById('total-solved').innerText=answered.length; trackActivity(); }
        updateProgress();
      }
    }

    function updateProgress(){
      const total=filteredQuestions.length, done=filteredQuestions.filter(q=>answered.some(a=>a===q.id)).length, pct=total?Math.round(done/total*100):0;
      document.getElementById("prog-bar").style.width=pct+"%"; document.getElementById("prog-label").innerText=`${done} / ${total}`;
    }

    function renderNav(){
      const data=(activeMainTab==="questions"||currentSubcategory==="bookmarks"?filteredQuestions:filteredNotes);
      document.getElementById("nav-btns").innerHTML=`<button class="btn btn-light" onclick="prev()">Previous</button><button class="btn btn-gold" onclick="next()">${currentIdx===data.length-1&&examMode?'Finish':'Next'}</button>`;
    }

    function next(){ const data=(activeMainTab==="questions"||currentSubcategory==="bookmarks"?filteredQuestions:filteredNotes); if(currentIdx<data.length-1){ currentIdx++; (activeMainTab==="questions"||currentSubcategory==="bookmarks")?showQ():showNote(); } else if(examMode) finishEx(); }
    function prev(){ if(currentIdx>0){ currentIdx--; (activeMainTab==="questions"||currentSubcategory==="bookmarks")?showQ():showNote(); } }
    function finishEx(){ alert(`Finished! Score: ${filteredQuestions.reduce((s,q,i)=>s+(userSels[i]===q.correct?1:0),0)}/${filteredQuestions.length}`); examMode=false; setMode('study'); }
    function setMode(m){ examMode=(m==='exam'); document.getElementById('m-study').className="m-btn"+(!examMode?" active":""); document.getElementById('m-exam').className="m-btn"+(examMode?" active":""); document.getElementById('timer').style.display=examMode?'block':'none'; if(examMode) { examSec=0; clearInterval(timerInt); timerInt=setInterval(()=>{examSec++; let m=Math.floor(examSec/60).toString().padStart(2,'0'), s=(examSec%60).toString().padStart(2,'0'); document.getElementById('timer').innerText=`${m}:${s}`;},1000); } else clearInterval(timerInt); start(currentSubcategory); }
    function goBack(){ if(document.getElementById("sub-dashboard").style.display==="grid") renderMain(); else openCat(currentCategory); }
    function getSafeImg(src){ if(!src)return''; return`<img src="https://images.weserv.nl/?url=${encodeURIComponent(src.trim())}&w=600&output=png" class="content-img" onerror="this.style.display='none'" alt="Img">`; }
    function getIcon(c){ const i={"Internal Medicine":"🩺","Surgery":"🔪","Pediatrics":"👶","Psychiatry":"🧠","Ethics & Legal":"⚖️","Emergency Medicine":"🚨","Obstetrics & Gynecology":"🤰","Family Medicine":"👨‍⚕️","Population & Prevention":"📊"}; return i[c]||"📚"; }
    function toggleBookmark(qId){ if(bookmarks.includes(qId)) bookmarks=bookmarks.filter(b=>b!==qId); else bookmarks.push(qId); localStorage.setItem('bookmarks',JSON.stringify(bookmarks)); showQ(); }

    init();
  </script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="MediVaultPro" data-color="#5F7FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>
</html>
